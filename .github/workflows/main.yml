name: BDD Testing Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  java-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java-bdd
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install Playwright Browsers
        run: |
          mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"
      - name: Run Tests
        run: mvn test

  ts-playwright-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ts-playwright-bdd
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ts-playwright-bdd/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Generate BDD Tests
        run: npx bddgen
      - name: Run Playwright tests
        run: npx playwright test

  python-playwright-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-playwright-bdd
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps
      - name: Run tests
        run: pytest

  ts-cypress-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ts-cypress-bdd
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ts-cypress-bdd/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./ts-cypress-bdd
          browser: chrome
